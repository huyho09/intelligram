<div class="chat-container">
  <div class="chat-header">
    <div class="d-flex align-items-center">
      <!-- <img src="assets/header.gif" alt="AI" class="header-icon" /> -->
       <h5>WELCOME</h5>
      <!-- <span class="header-title">ChatUML AI</span> -->
    </div>
    <button class="minimize-btn" (click)="minimize()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-dash" viewBox="0 0 16 16">
        <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z"/>
      </svg>
    </button>
  </div>

  <div class="chat-window" #chatWindow>
    <div *ngFor="let message of messages" class="message-item" [ngClass]="{'user-message': message.role === 'user', 'assistant-message': message.role === 'assistant'}">
      <div class="message-content">
        <p class="msg-text">{{ message.content }}</p>
      </div>
    </div>

    <div *ngIf="isLoading" class="message-item assistant-message">
        <div class="message-content">
            <p class="msg-text"><i>Thinking... <span class="spinner-border spinner-border-sm"></span></i></p>
        </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea
      class="form-control"
      rows="3"
      placeholder="What's on your mind right now?"
      [(ngModel)]="userInput"
      (keydown.enter)="handleEnterKey($event)"
      [disabled]="isLoading">
    </textarea>
    <button class="btn btn-primary send-btn" (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-send-fill" viewBox="0 0 16 16">
        <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/>
      </svg>
    </button>
  </div>
</div>
